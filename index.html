<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AUX GLOBAL — Visual Wireframe / Working Preview</title>
<meta name="description" content="AUX Global EC working visual wireframe. English master and Japanese client preview.">
<link rel="stylesheet" href="./v2.css">
</head><body>
<div id="app" class="preview">
  <div class="preview-bar">
    <div class="preview-brand"><span class="preview-dot"></span><strong>AUX GLOBAL</strong><span class="preview-sub">VISUAL WIREFRAME · WORKING V3</span></div>
    <div class="preview-actions">
      <button type="button" id="notes-toggle" class="preview-control">SHOW NOTES</button>
      <div class="lang-control" role="group" aria-label="Preview language">
        <button type="button" data-lang="en" class="active">EN</button>
        <button type="button" data-lang="ja">JP</button>
      </div>
      <button type="button" id="rail-toggle" class="preview-control">HIDE PAGES</button>
    </div>
  </div>
  <div class="preview-layout">
    <aside class="page-rail" id="page-rail">
      <div class="rail-heading"><div>PAGE INDEX</div><span id="page-count"></span></div>
      <nav id="page-index" aria-label="Wireframe pages"></nav>
      <div class="rail-foot">AUX Global EC / Working structure<br>Photography is provisional. Copy is not final.</div>
    </aside>
    <main class="stage">
      <div class="stage-meta"><div class="stage-breadcrumb" id="stage-breadcrumb"></div><div class="stage-note">DESKTOP PREVIEW / 1440 REFERENCE</div></div>
      <div class="site-frame" id="site-frame">
        <div id="site-app"></div>
      </div>
    </main>
  </div>
  <div class="toast" id="demo-toast" role="status" aria-live="polite"></div>
</div>
<script src="./v2.js"></script>
</body></html>
